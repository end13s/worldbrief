[project]
name = "worldbrief"
version = "0.2.0"
description = "Self-hosted news aggregator: RSS scraping, LLM classification and a map/timeline dashboard."
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.14.0",
    "apscheduler>=3.11.2",
    "fastapi>=0.136.1",
    "feedparser>=6.0.12",
    "pydantic>=2.7",
    "python-dotenv>=1.2.2",
    "uvicorn[standard]>=0.47.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["newspulse", "newspulse.api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
